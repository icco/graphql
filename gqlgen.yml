# .gqlgen.yml example
#
# Refer to https://gqlgen.com/config/
# for detailed .gqlgen.yml documentation.

schema:
- "*.graphql"
exec:
  filename: generated.go
model:
  filename: models_gen.go
resolver:
  layout: follow-schema
  package: graphql
  dir: .
models:
  Book:
    model: go.icco.me/graphql.Book
  Comment:
    model: go.icco.me/graphql.Comment
  Duration:
    model: go.icco.me/graphql.Duration
  Geo:
    model: go.icco.me/graphql.Geo
  Link:
    model: go.icco.me/graphql.Link
  Log:
    model: go.icco.me/graphql.Log
  Photo:
    model: go.icco.me/graphql.Photo
  Post:
    model: go.icco.me/graphql.Post
  Tweet:
    model: go.icco.me/graphql.Tweet
  TwitterURL:
    model: go.icco.me/graphql.TwitterURL
  User:
    model: go.icco.me/graphql.User
  URI:
    model: go.icco.me/graphql.URI
